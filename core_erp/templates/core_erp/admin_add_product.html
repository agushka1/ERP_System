<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Добавить товар — ERP</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 50px auto; padding: 0 20px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; font-weight: bold; color: #475569; }
        input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; width: 100%; box-sizing: border-box; }
        .btn-add { background-color: #10b981; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    {% include "core_erp/navbar.html" %}
    <div class="container"><div class="card">
        <h2>➕ Добавить новый мерч</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="action_add_product" value="1">
            <div class="form-group"><label>Название товара:</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Цена (в монетах):</label><input type="number" name="price" min="0.01" step="0.01" required></div>
            <div class="form-group"><label>Количество на складе:</label><input type="number" name="stock" min="0" required></div>
            <div class="form-group"><label>Фотография товара:</label><input type="file" name="image" accept="image/*"></div>
            <button type="submit" class="btn-add">Выложить в магазин</button>
        </form>
    </div></div>
</body>
</html>
