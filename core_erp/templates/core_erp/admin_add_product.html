{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар — RespectSys ERP</title>
    <link href="{% static 'style.css' %}" rel="stylesheet">
    <style>
        body { background-color: #090d16; color: #f8fafc; margin: 0; padding: 0; }
        .container { max-width: 550px; margin: 50px auto; padding: 0 20px; box-sizing: border-box; }

        .bg-custom-card { background: linear-gradient(145deg, #111827 0%, #1f2937 100%); border: 1px solid #374151; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7); }
        h2 { margin-top: 0; color: #ffffff; font-weight: 700; border-bottom: 1px solid #1e293b; padding-bottom: 12px; font-size: 22px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 13px; font-weight: bold; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-add { background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-add:hover { transform: scale(1.01); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body>

{% include "core_erp/navbar.html" %}

<div class="container">
    <div class="bg-custom-card">
        <h2>➕ Добавить новый мерч</h2>
        <p style="font-size: 13px; color: #64748b; margin-top: -6px; margin-bottom: 24px;">Заполните карточку, чтобы выложить товар на витрину корпоративного склада.</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="action_add_product" value="1">

            <div class="form-group">
                <label>Название товара:</label>
                <input type="text" name="name" class="form-control" placeholder="Например: Худи RespectSys" required>
            </div>

            <div class="form-group">
                <label>Цена (в монетах):</label>
                <input type="number" name="price" class="form-control" min="0.01" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-group">
                <label>Количество на складе:</label>
                <input type="number" name="stock" class="form-control" min="0" placeholder="0" required>
            </div>

            <div class="form-group">
                <label>Фотография товара:</label>
                <input type="file" name="image" class="form-control" accept="image/*">
            </div>

            <button type="submit" class="btn-add">Выложить в магазин</button>
        </form>
    </div>
</div>

</body>
</html>
